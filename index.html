
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHAMI GAMES - Easypaisa Deposit</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0f172a;color:#fff}
header{background:#1e293b;padding:15px;text-align:center;border-bottom:2px solid #22c55e}
header h1{color:#22c55e}
.container{max-width:700px;margin:auto;padding:15px}
.card{background:#1e293b;border-radius:16px;padding:20px;margin-bottom:18px;border:1px solid #334155}
.card h2{color:#22c55e;text-align:center;margin-bottom:10px}
.input{width:100%;padding:12px;border-radius:10px;margin:8px 0;background:#0f172a;color:#fff;border:1px solid #334155}
.btn{width:100%;padding:13px;border-radius:10px;border:none;font-weight:800;font-size:16px;cursor:pointer;margin-top:10px}
.btn-green{background:#22c55e;color:#000}
.btn-blue{background:#3b82f6;color:#fff}
.acc-box{background:#0f172a;border:2px dashed #22c55e;padding:18px;border-radius:12px;text-align:center;line-height:2}
</style>
</head>
<body>
<header>
<h1>SHAMI GAMES</h1>
<p>ڈیپازٹ اور ودڈرا</p>
</header>
<div class="container">

<div class="card">
<h2>💰 ڈیپازٹ کریں</h2>
<div class="acc-box">
<b style="color:#22c55e;font-size:20px">Easypaisa Account</b><br>
نمبر: <b style="font-size:24px">03360063760</b><br>
نام: <b style="font-size:18px">Yasir Naseer</b><br><br>
<span style="font-size:13px;color:#94a3b8">اس نمبر پر پیسے بھیج کر نیچے فارم بھریں</span>
</div>
<input class="input" id="dep_amount" type="number" placeholder="کتنے پیسے بھیجے؟">
<input class="input" id="dep_trx" type="text" placeholder="Trx ID لکھیں">
<input class="input" id="dep_number" type="text" placeholder="جس نمبر سے بھیجے">
<button class="btn btn-green" onclick="submitDeposit()">ڈیپازٹ جمع کرائیں</button>
<p id="dep_msg" style="color:#22c55e;text-align:center;margin-top:10px"></p>
</div>

<div class="card">
<h2>💸 ودڈرا کریں</h2>
<input class="input" id="with_amount" type="number" placeholder="کتنا ودڈرا کرنا ہے؟">
<input class="input" id="with_account" type="text" placeholder="اپنا Easypaisa نمبر">
<input class="input" id="with_name" type="text" placeholder="نام">
<button class="btn btn-blue" onclick="submitWithdraw()">ودڈرا ریکویسٹ</button>
<p id="with_msg" style="color:#22c55e;text-align:center;margin-top:10px"></p>
</div>

</div>
<script>
function submitDeposit(){
 let a=document.getElementById('dep_amount').value;
 let t=document.getElementById('dep_trx').value;
 if(!a||!t){alert('رقم اور Trx ID لکھیں');return;}
 let msg=`*DEPOSIT*%0AAmount:${a}%0ATrx:${t}%0AFrom:${document.getElementById('dep_number').value}%0ATo: 03360063760 Yasir Naseer`;
 window.open(`https://wa.me/923228664858?text=${msg}`,'_blank');
 document.getElementById('dep_msg').innerText="واٹس ایپ پر بھیج دیا گیا";
}
function submitWithdraw(){
 let a=document.getElementById('with_amount').value;
 let ac=document.getElementById('with_account').value;
 if(!a||!ac){alert('تفصیل لکھیں');return;}
 let msg=`*WITHDRAW*%0AAmount:${a}%0AAccount:${ac}%0AName:${document.getElementById('with_name').value}`;
 window.open(`https://wa.me/923228664858?text=${msg}`,'_blank');
 document.getElementById('with_msg').innerText="ریکویسٹ بھیج دی گئی";
}
</script>
</body>
</html>
